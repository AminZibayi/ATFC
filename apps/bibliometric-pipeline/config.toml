# Pipeline Configuration for Graph Building
# This file allows you to configure filtering thresholds independently for each graph type.
# min_weight: The minimum weight (co-occurrence count) an edge must have to be kept.
# remove_isolates: Whether to remove nodes that have no connecting edges after pruning.

[default]
min_weight = 1
remove_isolates = false

[co_author]
min_weight = 2
remove_isolates = false

[co_funding]
min_weight = 1
remove_isolates = false

[co_affiliation]
min_weight = 2
remove_isolates = false

[author_keywords]
min_weight = 2
remove_isolates = false

[wos_categories]
min_weight = 1
remove_isolates = false

[layout]
algorithm = "pyforceatlas2"
iterations = 2000

# ForceAtlas2-specific parameters (applies to 'pyforceatlas2' and 'fa2')
[layout.forceatlas2]
scaling_ratio = 2.0
gravity = 1.0
edge_weight_influence = 1.0
jitter_tolerance = 1.0
barnes_hut_optimize = true
barnes_hut_theta = 1.2
lin_log_mode = false
strong_gravity_mode = false

# Yifan Hu (SFDP)-specific parameters (applies to 'sfdp' and 'yifan_hu')
[layout.sfdp]
K = 1.0
overlap = "prism"
repulsiveforce = 1.0

