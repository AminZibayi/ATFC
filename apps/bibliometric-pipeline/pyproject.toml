[project]
name = "bibliometric-pipeline"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "networkx",
    "shared-python",
    "scipy>=1.17.1",
    "pyarrow",
    "fa2-modified",
    "pyforceatlas2",
    "igraph",
    "graphviz",
    "pydot",
    "lxml",
    "python-louvain",
]

[tool.uv.sources]
shared-python = { path = "../../libs/shared-python", editable = true }

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [".ruff_cache", ".venv", "dist"]
line-length = 88
indent-width = 4
