[project]
name = "g6-networks"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "networkx",
    "matplotlib",
    "shared-python",
    "scipy>=1.17.1",
    "pyarrow>=24.0.0",
]

[tool.uv.sources]
shared-python = { path = "../../libs/shared-python", editable = true }

[tool.uv]
package = false

[tool.ruff]
exclude = [".ruff_cache", ".venv", "dist"]
line-length = 88
indent-width = 4
