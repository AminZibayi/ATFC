[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/horizonpulse-crawler/html'
 --cov-report xml:'../../coverage/apps/horizonpulse-crawler/coverage.xml'
 --html='../../reports/apps/horizonpulse-crawler/unittests/html/index.html'
 --junitxml='../../reports/apps/horizonpulse-crawler/unittests/junit.xml'
"""

[project]
name = "horizonpulse-crawler"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.11"
readme = 'README.md'
dependencies = [
    "crawl4ai>=0.8.0",
    "shared-python",
]

[tool.uv.sources]
shared-python = { path = "../../libs/shared-python", editable = true }


[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
